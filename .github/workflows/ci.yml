name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build
      - name: Full regression
        run: python -m pytest
      - name: Ruff tracked Python surface
        run: |
          python -c "from pathlib import Path; import subprocess, sys; roots=(Path('src/specgrain'), Path('tests'), Path('examples')); files=sorted(str(p) for root in roots for p in root.rglob('*.py')); subprocess.check_call([sys.executable, '-m', 'ruff', 'check', *files])"
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: CLI smoke
        run: |
          python -m specgrain --help
          specgrain --help
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys; wheels=glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', '--no-deps', wheels[0]])"
      - name: Installed CLI smoke
        run: specgrain --help
