name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import re,tomllib; data=tomllib.load(open("pyproject.toml","rb")); version=data["project"]["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), version; print(version)')"
          tag="v${version}"
          wheel="specgrain-${version}-py3-none-any.whl"
          sdist="specgrain-${version}.tar.gz"
          notes="docs/releases/${tag}.md"
          title="SpecGrain ${tag}"
          test -f "$notes"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "wheel=$wheel"
            echo "sdist=$sdist"
            echo "notes=$notes"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Build release distributions
        env:
          WHEEL: ${{ steps.metadata.outputs.wheel }}
          SDIST: ${{ steps.metadata.outputs.sdist }}
        run: |
          python -m pip install build
          python -m build
          python -c 'import os; from pathlib import Path; files=sorted(p.name for p in Path("dist").iterdir()); expected=sorted([os.environ["WHEEL"], os.environ["SDIST"]]); assert files == expected, (files, expected)'
      - name: Publish or verify immutable-by-contract release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
          WHEEL: ${{ steps.metadata.outputs.wheel }}
          SDIST: ${{ steps.metadata.outputs.sdist }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags

          tag_exists=false
          tag_target=""
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_exists=true
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
          fi

          release_exists=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "$release_exists" = "true" ]; then
            if [ "$tag_exists" != "true" ]; then
              echo "GitHub Release $RELEASE_TAG exists without the expected Git tag." >&2
              exit 1
            fi
            state="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease --jq '[.tagName,.isDraft,.isPrerelease] | @tsv')"
            expected_state="${RELEASE_TAG}"$'\tfalse\tfalse'
            if [ "$state" != "$expected_state" ]; then
              echo "Existing $RELEASE_TAG release is not the expected public immutable-by-contract release: $state" >&2
              exit 1
            fi
            assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
            expected_assets="$(printf '%s\n' "$WHEEL" "$SDIST" | sort)"
            if [ "$assets" != "$expected_assets" ]; then
              echo "Existing $RELEASE_TAG assets do not match the release contract." >&2
              exit 1
            fi
            echo "SpecGrain $RELEASE_TAG is already published at historical tag target $tag_target; no release mutation is required."
            exit 0
          fi

          if [ "$tag_exists" = "true" ]; then
            echo "$RELEASE_TAG exists at $tag_target without a GitHub Release; refusing ambiguous partial publication." >&2
            exit 1
          fi

          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "dist/$WHEEL" \
            "dist/$SDIST" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES"
