name: Prepare 016 Ruff fixes

on:
  push:
    branches:
      - fix/016-ruff-baseline

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification tools
        run: python -m pip install "pytest>=8.0" "ruff==0.6.9"
      - name: Apply mechanical Ruff fixes
        run: python -m ruff check src --fix --unsafe-fixes
      - name: Verify fixed source
        run: python -m ruff check src
      - name: Full regression
        run: python -m pytest
      - name: Show exact patch
        run: git diff -- src/specgrain
      - name: Upload fixed source
        uses: actions/upload-artifact@v4
        with:
          name: fixed-specgrain-source
          path: src/specgrain
          if-no-files-found: error
