name: Prepare 016 Ruff fixes

on:
  push:
    branches:
      - fix/016-ruff-baseline

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification tools
        run: python -m pip install "pytest>=8.0" "ruff==0.6.9"
      - name: Apply automatic mechanical Ruff fixes
        shell: bash
        run: python -m ruff check src --fix --unsafe-fixes || true
      - name: Resolve remaining SIM102 mechanically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/specgrain/method.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if isinstance(raw, Sequence) and not isinstance(raw, str | bytes | bytearray):\n        if all(isinstance(item, str) for item in raw):\n            return tuple(raw)\n'''
          new = '''    if (\n        isinstance(raw, Sequence)\n        and not isinstance(raw, str | bytes | bytearray)\n        and all(isinstance(item, str) for item in raw)\n    ):\n        return tuple(raw)\n'''
          if old not in text:
              raise SystemExit("expected post-Ruff SIM102 target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify fixed source
        run: python -m ruff check src
      - name: Install fixed package editable
        run: python -m pip install -e . --no-deps
      - name: Full regression
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Patch whitespace guard
        run: git diff --check
      - name: Show exact patch
        run: git diff -- src/specgrain
      - name: Upload fixed source
        uses: actions/upload-artifact@v4
        with:
          name: fixed-specgrain-source
          path: src/specgrain
          if-no-files-found: error
      - name: Commit verified source fixes
        shell: bash
        run: |
          git add src/specgrain
          if git diff --cached --quiet; then
            echo "No verified source fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply verified Ruff baseline fixes [skip ci]"
          git push origin HEAD:fix/016-ruff-baseline
