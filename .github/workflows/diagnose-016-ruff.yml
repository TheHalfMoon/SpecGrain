name: Diagnose 016 Ruff

on:
  push:
    branches:
      - verify/016-ruff-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editable development environment
        run: python -m pip install -e ".[dev]"
      - name: Ruff before pytest
        run: python -m ruff check src tests examples
      - name: Full regression
        run: python -m pytest
      - name: Tracked tree unchanged after pytest
        run: git diff --exit-code
      - name: Untracked Python after pytest diagnostic
        continue-on-error: true
        shell: bash
        run: |
          files="$(git ls-files --others --exclude-standard -- 'src/**/*.py' 'tests/**/*.py' 'examples/**/*.py')"
          test -z "$files"
      - name: Ruff after pytest diagnostic
        continue-on-error: true
        run: python -m ruff check src tests examples
