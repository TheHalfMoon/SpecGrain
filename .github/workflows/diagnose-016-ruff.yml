name: Diagnose 016 Ruff

on:
  push:
    branches:
      - verify/016-ruff-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editable development environment
        run: python -m pip install -e ".[dev]"
      - name: Ruff combined after editable install
        continue-on-error: true
        run: python -m ruff check src tests examples
      - name: Ruff explicit files after editable install
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          files = sorted(
              str(path)
              for root in (Path("src/specgrain"), Path("tests"), Path("examples"))
              for path in root.rglob("*.py")
          )
          subprocess.check_call([sys.executable, "-m", "ruff", "check", *files])
          PY
      - name: Full regression
        run: python -m pytest
      - name: Ruff combined after pytest
        continue-on-error: true
        run: python -m ruff check src tests examples
      - name: Ruff explicit files after pytest
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          files = sorted(
              str(path)
              for root in (Path("src/specgrain"), Path("tests"), Path("examples"))
              for path in root.rglob("*.py")
          )
          subprocess.check_call([sys.executable, "-m", "ruff", "check", *files])
          PY
