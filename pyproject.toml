[project]
name = "specgrain"
version = "0.1.0"
description = "Deterministic, evidence-backed delivery for small verifiable software changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["specification", "software-delivery", "ai-agents", "verification", "devtools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/TheHalfMoon/SpecGrain"
Repository = "https://github.com/TheHalfMoon/SpecGrain"
Issues = "https://github.com/TheHalfMoon/SpecGrain/issues"

[project.scripts]
specgrain = "specgrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
